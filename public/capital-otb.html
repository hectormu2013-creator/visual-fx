<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capital OTB TV Network • Multicanal Simulcast</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #050811;
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .cotb-mosaic {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      width: 100%;
      height: 100%;
      background: #0f172a;
    }
    .cotb-mosaic.zoomed-mode .cotb-quad {
      display: none;
    }
    .cotb-mosaic.zoomed-mode .cotb-quad.zoomed {
      display: flex;
      grid-column: 1 / -1;
      grid-row: 1 / -1;
    }
    .cotb-quad {
      position: relative;
      width: 100%;
      height: 100%;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.16);
    }
    .cotb-quad.audio-active {
      border-color: rgba(16, 185, 129, 0.75);
      box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.45);
    }
    .cotb-quad video,
    .cotb-quad iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      display: block;
      background: #000;
    }
    .quad-overlay {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      opacity: 0.92;
      transition: opacity 0.25s ease;
    }
    .cotb-quad:hover .quad-overlay {
      opacity: 1;
    }
    .quad-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(9, 14, 28, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      padding: 3px 7px;
      backdrop-filter: blur(4px);
      max-width: 76%;
    }
    .quad-num {
      font-size: 0.68rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }
    .quad-select {
      background: transparent;
      color: #f1f5f9;
      border: none;
      font-size: 0.74rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      max-width: 190px;
      text-overflow: ellipsis;
    }
    .quad-select option {
      background: #0f172a;
      color: #f8fafc;
    }
    .quad-actions {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .quad-btn {
      background: rgba(9, 14, 28, 0.82);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .quad-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      color: #fff;
    }
    .quad-btn.active {
      background: rgba(16, 185, 129, 0.24);
      border-color: #10b981;
      color: #34d399;
    }
    .quad-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(2, 6, 23, 0.68);
      color: #94a3b8;
      font-size: 0.76rem;
      font-weight: 600;
      pointer-events: none;
      z-index: 5;
    }
    .quad-spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(56, 189, 248, 0.22);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .cotb-brand-watermark {
      position: absolute;
      top: 6px;
      right: 8px;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 58, 138, 0.82));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #e0f2fe;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <div class="cotb-brand-watermark">🇺🇸 CAPITAL OTB • MULTICANAL SIMULCAST</div>
  <div class="cotb-mosaic" id="mosaicGrid">
    <div class="cotb-quad" id="quad-1" data-quad="1">
      <div class="quad-media" id="media-1" style="width:100%;height:100%;"></div>
      <div class="quad-loader" id="loader-1"><div class="quad-spinner"></div><span>Señal 1...</span></div>
      <div class="quad-overlay">
        <div class="quad-pill">
          <span class="quad-num">OTB 1</span>
          <select class="quad-select" id="sel-1"></select>
        </div>
        <div class="quad-actions">
          <button class="quad-btn" id="aud-1" title="Activar/Silenciar Audio de esta pista">🔇</button>
          <button class="quad-btn" id="zoom-1" title="Ampliar/Restaurar esta pista">⛶</button>
        </div>
      </div>
    </div>
    <div class="cotb-quad" id="quad-2" data-quad="2">
      <div class="quad-media" id="media-2" style="width:100%;height:100%;"></div>
      <div class="quad-loader" id="loader-2"><div class="quad-spinner"></div><span>Señal 2...</span></div>
      <div class="quad-overlay">
        <div class="quad-pill">
          <span class="quad-num">OTB 2</span>
          <select class="quad-select" id="sel-2"></select>
        </div>
        <div class="quad-actions">
          <button class="quad-btn" id="aud-2" title="Activar/Silenciar Audio de esta pista">🔇</button>
          <button class="quad-btn" id="zoom-2" title="Ampliar/Restaurar esta pista">⛶</button>
        </div>
      </div>
    </div>
    <div class="cotb-quad" id="quad-3" data-quad="3">
      <div class="quad-media" id="media-3" style="width:100%;height:100%;"></div>
      <div class="quad-loader" id="loader-3"><div class="quad-spinner"></div><span>Señal 3...</span></div>
      <div class="quad-overlay">
        <div class="quad-pill">
          <span class="quad-num">OTB 3</span>
          <select class="quad-select" id="sel-3"></select>
        </div>
        <div class="quad-actions">
          <button class="quad-btn" id="aud-3" title="Activar/Silenciar Audio de esta pista">🔇</button>
          <button class="quad-btn" id="zoom-3" title="Ampliar/Restaurar esta pista">⛶</button>
        </div>
      </div>
    </div>
    <div class="cotb-quad" id="quad-4" data-quad="4">
      <div class="quad-media" id="media-4" style="width:100%;height:100%;"></div>
      <div class="quad-loader" id="loader-4"><div class="quad-spinner"></div><span>Señal 4...</span></div>
      <div class="quad-overlay">
        <div class="quad-pill">
          <span class="quad-num">OTB 4</span>
          <select class="quad-select" id="sel-4"></select>
        </div>
        <div class="quad-actions">
          <button class="quad-btn" id="aud-4" title="Activar/Silenciar Audio de esta pista">🔇</button>
          <button class="quad-btn" id="zoom-4" title="Ampliar/Restaurar esta pista">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Orden de prioridad oficial de Capital OTB TV Network (NY + Costa Este + Circuito Americano)
    const CAPITAL_OTB_PRIORITY_ORDER = [
      'aqueduct-racetrack',
      'belmont-park',
      'saratoga',
      'finger-lakes',
      'parx-racing',
      'mahoning-valley',
      'thistledown',
      'horseshoe-indianapolis',
      'presque-isle',
      'gulfstream-park',
      'laurel-park',
      'tampa-bay-downs',
      'delaware-park',
      'monmouth-park',
      'colonial-downs',
      'woodbine',
      'keeneland',
      'churchill-downs',
      'zia-park',
      'turf-paradise',
      'mountaineer-park',
      'charles-town',
      'penn-national',
      'santa-anita-park',
      'del-mar',
      'hawthorne',
      'oaklawn-park',
      'fair-grounds',
      'remington-park',
      'evangeline-downs',
      'delta-downs',
      'los-alamitos'
    ];

    const urlParams = new URLSearchParams(window.location.search);
    let parentAllowsAudio = urlParams.get('muted') === '0';
    let activeAudioQuad = parentAllowsAudio ? 1 : null;
    let zoomedQuad = null;

    let liveChannels = [];
    const quadAssigned = { 1: null, 2: null, 3: null, 4: null };
    const quadHls = { 1: null, 2: null, 3: null, 4: null };

    function getAuthQuery() {
      const token = localStorage.getItem('visual_fx_token') || '';
      const deviceId = localStorage.getItem('visual_fx_device_id') || 'TV-COTB';
      return `&deviceId=${encodeURIComponent(deviceId)}${token ? `&token=${encodeURIComponent(token)}` : ''}&quality=LIGHT&grid=4`;
    }

    function scoreChannelForCapitalOtb(ch) {
      const idx = CAPITAL_OTB_PRIORITY_ORDER.indexOf(ch.id);
      const isUsRcn = ch.streamUrl && ch.streamUrl.includes('ws.rcncdn.com');
      const isScheduledToday = ch.activeToday !== false;

      // Máxima prioridad: Hipódromos de EE.UU./NY con jornada activa hoy en el orden oficial de Capital OTB
      if (isUsRcn && isScheduledToday) {
        return idx !== -1 ? idx : 50;
      }
      // Segunda prioridad: Señales NYRA en vivo
      if (idx !== -1 && idx <= 2 && isScheduledToday) {
        return idx;
      }
      // Tercera prioridad: Otros hipódromos de 1/ST TV encendidos
      if (isUsRcn) {
        return 100 + (idx !== -1 ? idx : 50);
      }
      // Cuarta prioridad: Hipódromos internacionales en vivo (excluyendo canales 24/7 no hípicos de carreras puras como VSiN)
      if (ch.id === 'vsin' || ch.id === 'horse-tv') return 900;
      return 300 + (idx !== -1 ? idx : 100);
    }

    function destroyQuadPlayer(q) {
      if (quadHls[q]) {
        try {
          quadHls[q].stopLoad();
          quadHls[q].detachMedia();
          quadHls[q].destroy();
        } catch (e) {}
        quadHls[q] = null;
      }
      const media = document.getElementById(`media-${q}`);
      if (media) {
        const v = media.querySelector('video');
        if (v) {
          try {
            v._destroyed = true;
            if (v._reconnectTimer) clearTimeout(v._reconnectTimer);
            v.onerror = null;
            v.pause();
            v.removeAttribute('src');
            v.load();
          } catch (e) {}
        }
        media.innerHTML = '';
      }
    }

    function updateAudioStates() {
      [1, 2, 3, 4].forEach(q => {
        const quadEl = document.getElementById(`quad-${q}`);
        const audBtn = document.getElementById(`aud-${q}`);
        const v = document.querySelector(`#media-${q} video`);
        const isUnmuted = (activeAudioQuad === q);

        if (v) v.muted = !isUnmuted;
        if (quadEl) quadEl.classList.toggle('audio-active', isUnmuted);
        if (audBtn) {
          audBtn.classList.toggle('active', isUnmuted);
          audBtn.textContent = isUnmuted ? '🔊' : '🔇';
        }
      });
    }

    function playQuadChannel(q, channelId) {
      const ch = liveChannels.find(c => c.id === channelId);
      if (!ch) return;

      quadAssigned[q] = channelId;
      const sel = document.getElementById(`sel-${q}`);
      if (sel && sel.value !== channelId) sel.value = channelId;

      destroyQuadPlayer(q);

      const media = document.getElementById(`media-${q}`);
      const loader = document.getElementById(`loader-${q}`);
      if (!media) return;
      if (loader) loader.style.display = 'flex';

      const rawUrl = ch.streamUrl || ch.iframeUrl;
      if (ch.type === 'iframe') {
        if (loader) loader.style.display = 'none';
        media.innerHTML = `<iframe src="${rawUrl}" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
        return;
      }

      media.innerHTML = `<video id="v-${q}" autoplay muted playsinline></video>`;
      const video = document.getElementById(`v-${q}`);
      const hideLoader = () => { if (loader) loader.style.display = 'none'; };
      video.addEventListener('loadeddata', hideLoader, { once: true });
      video.addEventListener('playing', hideLoader, { once: true });

      const safeProxy = (window.location.protocol === 'https:' && ch.proxyUrl && ch.proxyUrl.startsWith('http://'))
        ? ch.proxyUrl.replace(/^http:\/\//, 'https://')
        : ch.proxyUrl;
      const primaryUrl = `${safeProxy}${getAuthQuery()}`;

      if (rawUrl && rawUrl.includes('ws.rcncdn.com')) {
        video._destroyed = false;
        video._primaryUrl = primaryUrl;
        video.src = primaryUrl;
        video.onerror = () => {
          if (video._destroyed || video._pausedByHidden) return;
          if (video._reconnectTimer) clearTimeout(video._reconnectTimer);
          video._reconnectTimer = setTimeout(() => {
            if (video._destroyed || video._pausedByHidden) return;
            video.src = `${primaryUrl}&_t=${Date.now()}`;
            video.play().catch(() => {});
          }, 3000);
        };
        video.muted = (activeAudioQuad !== q);
        video.play().catch(() => {});
        return;
      }

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: false,
          lowLatencyMode: false,
          capLevelToPlayerSize: true,
          backBufferLength: 0,
          maxBufferLength: 3,
          maxMaxBufferLength: 5,
          maxBufferSize: 2 * 1024 * 1024,
          startLevel: 0
        });
        hls.loadSource(primaryUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          hideLoader();
          hls.autoLevelCappedAt = 0;
          video.muted = (activeAudioQuad !== q);
          video.play().catch(() => {});
        });
        quadHls[q] = hls;
      } else {
        video.src = primaryUrl;
        video.muted = (activeAudioQuad !== q);
        video.play().catch(() => {});
      }
    }

    function populateQuadSelectors() {
      [1, 2, 3, 4].forEach(q => {
        const sel = document.getElementById(`sel-${q}`);
        if (!sel) return;
        sel.innerHTML = '';
        liveChannels.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = ch.id;
          opt.textContent = `${ch.flag || '🏇'} ${ch.name}`;
          if (quadAssigned[q] === ch.id) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.onchange = (e) => {
          playQuadChannel(q, e.target.value);
        };
      });
    }

    function setupQuadControls() {
      [1, 2, 3, 4].forEach(q => {
        const audBtn = document.getElementById(`aud-${q}`);
        const zoomBtn = document.getElementById(`zoom-${q}`);
        const quadEl = document.getElementById(`quad-${q}`);

        if (audBtn) {
          audBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            activeAudioQuad = (activeAudioQuad === q) ? null : q;
            updateAudioStates();
          });
        }
        const toggleZoom = (e) => {
          if (e) e.stopPropagation();
          const grid = document.getElementById('mosaicGrid');
          if (zoomedQuad === q) {
            zoomedQuad = null;
            grid.classList.remove('zoomed-mode');
            [1, 2, 3, 4].forEach(n => document.getElementById(`quad-${n}`).classList.remove('zoomed'));
          } else {
            zoomedQuad = q;
            grid.classList.add('zoomed-mode');
            [1, 2, 3, 4].forEach(n => document.getElementById(`quad-${n}`).classList.toggle('zoomed', n === q));
          }
        };
        if (zoomBtn) zoomBtn.addEventListener('click', toggleZoom);
        if (quadEl) quadEl.addEventListener('dblclick', toggleZoom);
      });
    }

    // Escuchar comando de audio desde la celda principal de Visual-FX
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data && data.type === 'VFX_AUDIO_STATE') {
        if (data.muted) {
          activeAudioQuad = null;
        } else if (!activeAudioQuad) {
          activeAudioQuad = 1;
        }
        updateAudioStates();
      }
    });

    // Liberar ancho de banda cuando la pestaña está oculta
    document.addEventListener('visibilitychange', () => {
      const isHidden = document.hidden;
      [1, 2, 3, 4].forEach(q => {
        if (quadHls[q]) {
          if (isHidden) quadHls[q].stopLoad();
          else quadHls[q].startLoad();
          return;
        }
        const v = document.getElementById(`v-${q}`);
        if (v && v._primaryUrl) {
          if (isHidden && activeAudioQuad !== q) {
            v._pausedByHidden = true;
            if (v._reconnectTimer) clearTimeout(v._reconnectTimer);
            v.pause();
            v.removeAttribute('src');
            v.load();
          } else if (!isHidden && v._pausedByHidden) {
            v._pausedByHidden = false;
            v.src = `${v._primaryUrl}&_t=${Date.now()}`;
            v.play().catch(() => {});
          }
        }
      });
    });

    async function initCapitalOtbMosaic() {
      setupQuadControls();
      try {
        const res = await fetch('/api/channels');
        const data = await res.json();
        const all = (data.channels || []).filter(c => c.onAir && c.id !== 'capital-otb');

        all.sort((a, b) => scoreChannelForCapitalOtb(a) - scoreChannelForCapitalOtb(b));
        liveChannels = all;

        if (liveChannels.length === 0) return;

        [1, 2, 3, 4].forEach((q, idx) => {
          const ch = liveChannels[idx % liveChannels.length];
          quadAssigned[q] = ch.id;
        });

        populateQuadSelectors();

        // Iniciar las 4 sub-señales con ligero escalonamiento (250ms) para evitar picos de red simultáneos
        for (let q = 1; q <= 4; q++) {
          playQuadChannel(q, quadAssigned[q]);
          await new Promise(r => setTimeout(r, 250));
        }
        updateAudioStates();
      } catch (err) {
        console.error('Error iniciando Capital OTB Multicanal:', err);
      }
    }

    initCapitalOtbMosaic();
  </script>
</body>
</html>
